<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memes do Amigo</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
      color: #f8fafc;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: 1px;
    }

    .subtitle {
      color: #cbd5e1;
      margin-top: 10px;
      font-size: 1rem;
    }

    .panel {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
      margin-bottom: 28px;
    }

    .upload-form {
      display: grid;
      grid-template-columns: 1.2fr 1fr auto;
      gap: 14px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.88rem;
      color: #cbd5e1;
      font-weight: 700;
    }

    input[type="text"],
    input[type="file"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      outline: none;
    }

    input[type="file"] {
      padding: 10px;
      cursor: pointer;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 700;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .primary {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: white;
    }

    .danger {
      background: #ef4444;
      color: white;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 22px;
    }

    .card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
      background: #1e293b;
    }

    .card-body {
      padding: 16px 14px 18px;
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 1.1rem;
      color: #f8fafc;
    }

    .card p {
      margin: 0 0 16px;
      color: #cbd5e1;
      font-size: 0.9rem;
    }

    .card-actions {
      display: flex;
      justify-content: flex-end;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      background: rgba(15, 23, 42, 0.6);
      border: 1px dashed rgba(148, 163, 184, 0.5);
      border-radius: 18px;
      padding: 40px 20px;
      color: #cbd5e1;
    }

    @media (max-width: 760px) {
      .upload-form {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Memes do Seu Amigo</h1>
      <p class="subtitle">Adiciona fotos, rotula e salva no navegador. Só pra zoar ele mesmo 😈</p>
    </header>

    <section class="panel">
      <form id="uploadForm" class="upload-form">
        <div class="field">
          <label for="photoInput">Escolhe as fotos</label>
          <input id="photoInput" type="file" accept="image/*" multiple />
        </div>

        <div class="field">
          <label for="captionInput">Legenda do meme</label>
          <input id="captionInput" type="text" placeholder="Ex: O cara que acha que é o dono da rua" />
        </div>

        <button class="primary" type="submit">Adicionar</button>
      </form>
    </section>

    <section id="gallery" class="gallery"></section>
  </div>

  <script>
    const STORAGE_KEY = "memes-do-amigo-v1";
    const gallery = document.getElementById("gallery");
    const form = document.getElementById("uploadForm");
    const photoInput = document.getElementById("photoInput");
    const captionInput = document.getElementById("captionInput");

    function loadMemes() {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved ? JSON.parse(saved) : [];
    }

    function saveMemes(memes) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(memes));
    }

    function renderGallery() {
      const memes = loadMemes();

      if (!memes.length) {
        gallery.innerHTML = `
          <div class="empty">
            <h2>Nenhuma foto ainda 😅</h2>
            <p>Escolhe uma imagem e manda esse amigo pro status.</p>
          </div>
        `;
        return;
      }

      gallery.innerHTML = memes.map((meme) => `
        <article class="card">
          <img src="${meme.src}" alt="${meme.caption}" />
          <div class="card-body">
            <h3>${meme.caption || "Meme sem legenda"}</h3>
            <p>📸 ${meme.name}</p>
            <div class="card-actions">
              <button class="danger" data-id="${meme.id}">Remover</button>
            </div>
          </div>
        </article>
      `).join("");
    }

    function addMemes(files, caption) {
      const memes = loadMemes();

      Array.from(files).forEach((file) => {
        if (!file.type.startsWith("image/")) return;

        const reader = new FileReader();

        reader.onload = (event) => {
          memes.unshift({
            id: Date.now() + Math.random(),
            name: file.name,
            caption: caption.trim() || "Meme sem legenda",
            src: event.target.result
          });

          saveMemes(memes);
          renderGallery();
        };

        reader.readAsDataURL(file);
      });
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const files = photoInput.files;
      const caption = captionInput.value;

      if (!files || files.length === 0) {
        alert("Escolhe pelo menos uma foto antes de adicionar.");
        return;
      }

      addMemes(files, caption);
      form.reset();
    });

    gallery.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-id]");
      if (!button) return;

      const id = Number(button.dataset.id);
      const memes = loadMemes().filter((meme) => meme.id !== id);
      saveMemes(memes);
      renderGallery();
    });

    renderGallery();
  </script>
</body>
</html>
